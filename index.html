<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainstorming</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--fond:#eef2f0;--col:#f9fbfa;--encre:#1d2b28;--doux:#5d706b;--accent:#0a7c72;--accent-f:#065a53;--post:#fff6c9;--trait:#d3dcd9}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--encre);background:var(--fond);height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--trait)}
header b{font-size:16px}
header input{font:inherit;padding:5px 8px;border:1px solid var(--trait);border-radius:4px}
#votes{margin-left:auto;color:var(--doux)}
button{font:inherit;cursor:pointer;border:0;border-radius:4px;padding:5px 10px;background:var(--accent);color:#fff}
button:hover{background:var(--accent-f)}
button:disabled{background:#9db5b1;cursor:default}
#ctrl{display:inline-flex;gap:6px;align-items:center}
#etat{font-weight:600;color:var(--accent-f)}
#tps{font-weight:600;font-variant-numeric:tabular-nums}
#tps.fin{color:#a02020}
.col h2 b{flex:1}
.outils{display:inline-flex;gap:2px;margin-left:8px}
.pj{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;font-size:12px;align-items:center}
.fic{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--trait);border-radius:3px;padding:0 4px;max-width:100%}
.fic a{color:var(--accent-f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .sup{padding:0 4px}
.paquet{border:2px dashed var(--accent);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:6px;background:rgba(10,124,114,.06)}
.paquet::before{content:'Paquet \00B7  ' attr(data-n) ' idées';font-size:11px;color:var(--doux)}
.card.cible{outline:2px solid var(--accent);outline-offset:1px}
.palette{display:inline-flex;gap:3px;align-items:center}
.pt{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.35);padding:0}
.reac{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;align-items:center}
.rb{background:rgba(255,255,255,.7);color:var(--encre);border:1px solid var(--trait);padding:1px 6px}
.rb:hover{background:#fff}
.rb.mine{background:var(--accent);color:#fff}
.rb.mine:hover{background:var(--accent-f)}
.comms{flex-basis:100%;display:flex;flex-direction:column;gap:3px;font-size:12px}
.comm{background:rgba(255,255,255,.65);border-radius:3px;padding:2px 4px;display:flex;gap:4px;align-items:baseline}
.comm span{flex:1;overflow-wrap:anywhere}
.comms input{font:inherit;padding:3px;border:1px solid var(--trait);border-radius:3px}
#podium{padding:12px 14px 0;max-height:50vh;overflow:auto}
#podium[hidden]{display:none}
#podium h2{margin:0 0 8px}
.pod{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--trait);border-left:8px solid var(--trait);border-radius:6px;padding:8px 12px;margin-bottom:8px}
.pod.r1{border-left-color:#d4a017;font-size:1.25em}
.pod.r2{border-left-color:#9aa5a8;font-size:1.1em}
.pod.r3{border-left-color:#b87333}
.pod .med{font-size:1.8em}
.pod .tx{flex:1;overflow-wrap:anywhere}
.pod small{display:block;color:var(--doux)}
.pod .n{font-weight:600;white-space:nowrap}
body.proj{font-size:20px}
body.proj header>*:not(b):not(#etat):not(#tps):not(#votes):not(#projBtn){display:none}
body.proj .ajout,body.proj .outils,body.proj .card .sup,body.proj .pj .sup,body.proj .pt{display:none}
body.proj .col{flex-basis:340px}
body.proj .card p{font-size:1.15em}
body.proj #tps{font-size:1.6em}
header select{font:inherit;padding:5px 8px;border:1px solid var(--trait);border-radius:4px;background:#fff}
.ajoutlien{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.ajoutlien input,.ajoutlien textarea{font:inherit;padding:4px;border:1px solid var(--trait);border-radius:3px}
.ajoutlien textarea{resize:vertical;min-height:50px}
#pan2{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#pan2[hidden]{display:none}
.boite p{margin:0}
#rz-nom{font:inherit;padding:6px;border:1px solid var(--trait);border-radius:4px}
#pan{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#pan[hidden]{display:none}
.boite{background:#fff;border-radius:6px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;gap:8px;padding:12px}
.bar{display:flex;gap:6px;align-items:center}
.bar b{flex:1}
#sortie{font:13px/1.4 Consolas,monospace;height:340px;max-height:60vh;padding:8px;border:1px solid var(--trait);border-radius:4px;resize:vertical}
.sup:disabled{background:transparent;opacity:.3;cursor:default}
.col h2 input{font:inherit;font-weight:600;padding:2px 4px;border:1px solid var(--accent);border-radius:3px;width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#board{flex:1;display:flex;gap:12px;padding:12px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 260px;max-height:100%;display:flex;flex-direction:column;background:var(--col);border:1px solid var(--trait);border-radius:6px}
.col.over{border-color:var(--accent);background:#e3f1ee}
.col h2{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--trait);display:flex;justify-content:space-between}
.col h2 span{color:var(--doux);font-weight:400}
.cards{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
.card{background:var(--post);padding:8px 10px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.18);cursor:grab}
.card p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--doux)}
.meta .de{flex:1}
.vote{background:transparent;color:var(--accent-f);border:1px solid var(--accent);padding:1px 8px}
.vote.mine{background:var(--accent);color:#fff}
.sup{background:transparent;color:var(--doux);padding:0 6px;font-size:16px}
.sup:hover{background:transparent;color:#a02020}
.ajout{padding:8px;border-top:1px solid var(--trait);display:flex;flex-direction:column;gap:6px}
.ajout textarea{font:inherit;resize:vertical;min-height:44px;padding:6px;border:1px solid var(--trait);border-radius:4px}
#msg{padding:6px 14px;color:#a02020;min-height:28px}
.vide{margin:auto;color:var(--doux);text-align:center;padding:30px}
</style>
</head>
<body>
<header>
  <b>Brainstorming <small style="font-weight:400;color:#5d706b">v20</small></b>
  <label>Prénom <input id="pseudo" size="14" placeholder="Ton prénom"></label>
  <form id="nf"><input id="ncol" placeholder="Nom de la catégorie"> <button>Ajouter une catégorie</button></form>
  <select id="modele" hidden aria-label="Modèle de catégories">
    <option value="">Modèle de catégories…</option>
    <option value="retro">Rétrospective : Bien / À améliorer / Idées</option>
    <option value="dac">Démarrer / Arrêter / Continuer</option>
    <option value="ffom">FFOM : Forces, Faiblesses, Opportunités, Menaces</option>
    <option value="4l">4L : Aimé, Appris, Manqué, Souhaité</option>
  </select>
  <label><input type="checkbox" id="isAnim"> Animateur</label>
  <span id="ctrl"></span>
  <span id="etat"></span>
  <span id="tps"></span>
  <button type="button" id="exp" hidden>Exporter</button>
  <button type="button" id="projBtn">Projection</button>
  <span id="votes"></span>
</header>
<div id="msg" role="status"></div>
<section id="podium" hidden aria-live="polite"></section>
<main id="board"></main>
<div id="pan2" hidden>
  <div class="boite">
    <div class="bar"><b>Nouvelle séance</b></div>
    <p id="rz-txt"></p>
    <input id="rz-nom" placeholder="Nom de la séance ou du groupe (obligatoire)" aria-label="Nom de la séance">

    <label><input type="checkbox" id="rz-cat" checked> Garder les catégories</label>
    <div class="bar">
      <button type="button" id="rz-exp">Exporter d’abord</button>
      <button type="button" id="rz-go">Archiver et vider</button>
      <button type="button" id="rz-no">Annuler</button>
    </div>
  </div>
</div>
<div id="pan" hidden>
  <div class="boite">
    <div class="bar"><b>Synthèse</b>
      <button type="button" id="fmtT">Texte</button>
      <button type="button" id="fmtC">Tableau (Excel)</button>
      <button type="button" id="cop">Copier</button>
      <button type="button" id="fer">Fermer</button></div>
    <textarea id="sortie" readonly aria-label="Synthèse à copier"></textarea>
  </div>
</div>

<script>
const MAX_VOTES = 3;           // votes par personne
let recs = [], cols = [], me = localStorage.getItem('bs_me') || '';
const PHASES = { ecriture: 'Écriture', decouverte: 'Découverte', vote: 'Vote', resultats: 'Résultats' };
const classe = () => phase === 'vote' || phase === 'resultats';   // idées classées par votes
let fin = 0; // heure de fin du minuteur (ms), 0 = arrêté
let phase = 'ecriture', anon = false, anim = localStorage.getItem('bs_anim') === '1';
// En phase Écriture, chacun ne voit que ses propres idées
const visible = r => phase !== 'ecriture' || (r.Auteur && r.Auteur === me);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const voters = r => (r.Votants || '').split(',').map(s => s.trim()).filter(Boolean);
const T = () => grist.selectedTable;
const say = t => { $('#msg').textContent = t || ''; if (t) setTimeout(() => $('#msg').textContent = '', 6000); };
const erreur = e => say('Écriture impossible : ' + (e && e.message || e));
let map = {};
const raw = f => Object.fromEntries(Object.entries(f).map(([k, v]) => [map[k], v]));
const act = async a => grist.docApi.applyUserActions(a(await T().getTableId()));
const upd = (id, f) => act(t => [['UpdateRecord', t, id, raw(f)]]).catch(erreur);
const add = f => act(t => [['AddRecord', t, null, raw(f)]]).catch(erreur);
const del = id => act(t => [['RemoveRecord', t, id]]).catch(erreur);
const mesVotes = () => recs.filter(r => voters(r).includes(me)).length;

grist.ready({
  requiredAccess: 'full',
  columns: [
    { name: 'Texte', title: 'Texte', type: 'Text' },
    { name: 'Colonne', title: 'Catégorie', type: 'Text' },
    { name: 'Auteur', title: 'Auteur', type: 'Text' },
    { name: 'Votants', title: 'Votants', type: 'Text' },
    { name: 'PJ', title: 'Pièces jointes', type: 'Attachments', optional: true },
    { name: 'Liens', title: 'Liens (documents)', type: 'Text', optional: true },
    { name: 'Couleur', title: 'Couleur', type: 'Text', optional: true },
    { name: 'Groupe', title: 'Groupe (paquets)', type: 'Text', optional: true },
    { name: 'Reactions', title: 'Réactions', type: 'Text', optional: true },
    { name: 'Commentaires', title: 'Commentaires', type: 'Text', optional: true }
  ]
});
grist.onRecords((rows, m) => { map = m || {}; recs = grist.mapColumnNames(rows) || []; render(); });
grist.onOptions(o => {
  if (session) return;   // l'état vient de la table Session
  o = o || {};
  cols = o.cols || [];
  phase = PHASES[o.phase] ? o.phase : 'ecriture';
  anon = !!o.anon;
  fin = Number(o.fin) || 0;
  render();
});

$('#pseudo').value = me;
$('#pseudo').addEventListener('change', e => {
  me = e.target.value.replace(/,/g, ' ').trim();
  localStorage.setItem('bs_me', me); render();
});
$('#isAnim').addEventListener('change', e => {
  anim = e.target.checked;
  localStorage.setItem('bs_anim', anim ? '1' : '0'); render();
});
$('#nf').addEventListener('submit', e => {
  e.preventDefault();
  const n = $('#ncol').value.trim();
  if (!n || allCols().includes(n)) return;
  cols = [...cols, n]; opt('cols', cols);
  $('#ncol').value = ''; render();
});

function entete() {
  $('#isAnim').checked = anim;
  $('#exp').hidden = !anim;
  $('#modele').hidden = !anim;
  $('#etat').textContent = 'Phase : ' + PHASES[phase] + (anon ? ' (anonyme)' : '');
  const c = $('#ctrl'); c.textContent = '';
  if (!anim) return;
  Object.entries(PHASES).forEach(([k, n]) => {
    const b = el('button', null, n); b.disabled = k === phase;
    b.onclick = () => opt('phase', k);
    c.append(b);
  });
  const l = el('label'), cb = el('input'); cb.type = 'checkbox'; cb.checked = anon;
  cb.onchange = () => opt('anon', cb.checked);
  l.append(cb, ' Anonyme'); c.append(l);
  const mn = el('input'); mn.type = 'number'; mn.min = 1; mn.max = 120; mn.style.width = '60px';
  mn.value = localStorage.getItem('bs_min') || 5; mn.title = 'Durée en minutes';
  mn.oninput = () => localStorage.setItem('bs_min', mn.value);
  const go = el('button', null, 'Lancer');
  go.onclick = () => opt('fin', Date.now() + Math.max(1, Number(mn.value) || 5) * 60000);
  const st = el('button', null, 'Arrêter'); st.onclick = () => opt('fin', 0);
  const nv = el('button', null, 'Nouvelle séance');
  nv.onclick = () => {
    $('#rz-txt').textContent = `Les ${recs.length} idée(s) seront copiées dans la table « Archive », puis supprimées du tableau pour tous les participants. La phase repasse sur « Écriture » et le minuteur s\u2019arrête.`;
    $('#pan2').hidden = false;
  };
  c.append(mn, ' min', go, st, nv);
}

function tick() {
  const t = $('#tps');
  if (!fin) { t.textContent = ''; t.classList.remove('fin'); return; }
  const s = Math.round((fin - Date.now()) / 1000);
  if (s <= 0) { t.textContent = 'Temps écoulé'; t.classList.add('fin'); return; }
  t.textContent = '\u23F1 ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  t.classList.remove('fin');
}
setInterval(tick, 1000);

function outils(name, i, names, total) {
  const o = el('span', 'outils');
  const mk = (txt, titre, fn, off) => { const b = el('button', 'sup', txt); b.title = titre; b.disabled = !!off; b.onclick = fn; return b; };
  const save = arr => { cols = arr; opt('cols', arr); render(); };
  const echange = d => { const a = [...names]; [a[i + d], a[i]] = [a[i], a[i + d]]; save(a); };
  o.append(
    mk('\u25C0', 'Déplacer à gauche', () => echange(-1), i === 0),
    mk('\u25B6', 'Déplacer à droite', () => echange(1), i === names.length - 1),
    mk('\u270E', 'Renommer', e => renommer(e, name, names, save)),
    mk('\u00D7', 'Supprimer (catégorie vide uniquement)', () => {
      if (total) return say('Cette catégorie contient des idées : déplace-les d\u2019abord.');
      save(names.filter(n => n !== name));
    })
  );
  return o;
}

function renommer(e, name, names, save) {
  const nom = e.target.closest('h2').querySelector('b');
  const inp = el('input'); inp.value = name; nom.replaceWith(inp); inp.focus(); inp.select();
  let fait = false;
  const ok = () => {
    if (fait) return; fait = true;
    const n = inp.value.trim();
    if (!n || n === name) return render();
    if (names.includes(n)) { say('Cette catégorie existe déjà.'); return render(); }
    const ids = recs.filter(r => (r.Colonne || names[0]) === name).map(r => r.id);
    save(names.map(x => x === name ? n : x));
    if (ids.length) act(t => ids.map(id => ['UpdateRecord', t, id, raw({ Colonne: n })])).catch(erreur);
  };
  inp.onkeydown = ev => { if (ev.key === 'Enter') ok(); if (ev.key === 'Escape') { fait = true; render(); } };
  inp.onblur = ok;
}

const liensDe = r => (r.Liens || '').split('\n').filter(Boolean)
  .map(l => l.includes('\t') ? l.split('\t') : ['', l]).filter(([, u]) => /^https?:\/\//i.test(u));
// Paquets : identifiant interne -> « Paquet n » (seulement les groupes de 2 idées ou plus)
function paquets() {
  const m = new Map(), out = new Map();
  recs.forEach(r => { if (map.Groupe && r.Groupe) { if (!m.has(r.Groupe)) m.set(r.Groupe, []); m.get(r.Groupe).push(r); } });
  [...m.entries()].filter(([, l]) => l.length > 1)
    .sort((a, b) => Math.min(...a[1].map(r => r.id)) - Math.min(...b[1].map(r => r.id)))
    .forEach(([g], i) => out.set(g, 'Paquet ' + (i + 1)));
  return out;
}
// Réactions et commentaires sous forme de texte (export et archive)
const reacDe = r => { const o = lireReac(r); return REACTIONS.filter(e => Array.isArray(o[e]) && o[e].length).map(e => [e, o[e].length]); };
const reacTxt = r => reacDe(r).map(([e, n]) => e + ' ' + n).join(' ; ');
const commTxt = ([a, t]) => (anon || !a ? '' : a + ' : ') + t;
function synthese(fmt) {
  const names = allCols();
  const aut = r => anon ? '' : (r.Auteur || '');
  const tri = (a, b) => voters(b).length - voters(a).length || a.id - b.id;
  const dans = n => recs.filter(r => (r.Colonne || names[0]) === n).sort(tri);
  const l = [];
  if (fmt === 'tableau') {
    const c = s => String(s == null ? '' : s).replace(/[\t\r\n]+/g, ' '), pq = paquets();
    l.push(['Catégorie', 'Idée', 'Votes', ...(anon ? [] : ['Auteur']), 'Liens', 'Réactions', 'Commentaires', 'Paquet'].join('\t'));
    names.forEach(n => dans(n).forEach(r =>
      l.push([n, c(r.Texte), voters(r).length, ...(anon ? [] : [c(aut(r))]), c(liensDe(r).map(([nm, u]) => (nm ? nm + ' : ' : '') + u).join(' ; ')), c(reacTxt(r)), c(lireComm(r).map(commTxt).join(' | ')), c(pq.get(r.Groupe) || '')].join('\t'))));
    return l.join('\n');
  }
  names.forEach(n => {
    const d = unites(dans(n), true).flatMap(x => x.cards), pq = paquets();
    let dernier = null;
    l.push(`${n} (${d.length})`);
    d.forEach(r => {
      const nom = pq.get(r.Groupe);
      if (nom && nom !== dernier) l.push('  ' + nom + ' :');
      dernier = nom || null;
      l.push(`${nom ? '  ' : ''}- ${r.Texte} [${voters(r).length} vote${voters(r).length > 1 ? 's' : ''}]${aut(r) ? ' \u2014 ' + aut(r) : ''}`);
      liensDe(r).forEach(([nm, u]) => l.push('    \u21B3 ' + (nm ? nm + ' : ' : '') + u));
      if (reacDe(r).length) l.push('    ' + reacDe(r).map(([e, n]) => e + ' ' + n).join('  '));
      lireComm(r).forEach(c => l.push('    \uD83D\uDCAC ' + commTxt(c)));
    });
    l.push('');
  });
  return l.join('\n').trim();
}
let fmtSortie = 'texte';
const montre = f => { fmtSortie = f; $('#sortie').value = synthese(f); $('#pan').hidden = false; };
const flash = t => { $('#cop').textContent = t; setTimeout(() => $('#cop').textContent = 'Copier', 2500); };
$('#exp').onclick = () => montre(fmtSortie);
$('#fmtT').onclick = () => montre('texte');
$('#fmtC').onclick = () => montre('tableau');
$('#fer').onclick = () => $('#pan').hidden = true;
$('#cop').onclick = async () => {
  const t = $('#sortie'); t.select();
  try { await navigator.clipboard.writeText(t.value); flash('Copié \u2713'); }
  catch (e) { flash(document.execCommand('copy') ? 'Copié \u2713' : 'Ctrl+C pour copier'); }
};

// ---- Pièces jointes (API REST de Grist, jeton temporaire) ----
let tok = null; const noms = {};
async function api() {
  if (!tok || Date.now() > tok.exp) {
    const t = await grist.docApi.getAccessToken({ readOnly: false });
    tok = { base: t.baseUrl, token: t.token, exp: Date.now() + (t.ttlMsecs || 60000) - 5000 };
  }
  return tok;
}
const ids = v => (Array.isArray(v) ? v : []).filter(x => typeof x === 'number');
async function charger(i) {   // récupère le nom du fichier
  if (i in noms) return; noms[i] = '\u2026';
  try {
    const a = await api();
    const r = await fetch(`${a.base}/attachments/${i}?auth=${a.token}`);
    noms[i] = (await r.json()).fileName || ('Fichier ' + i);
  } catch (e) { noms[i] = 'Fichier ' + i; }
  render();
}
async function joindre(r, files) {
  try {
    const a = await api(), fd = new FormData();
    [...files].forEach(f => fd.append('upload', f));
    const res = await fetch(`${a.base}/attachments?auth=${a.token}`, { method: 'POST', body: fd })
      .catch(e => { throw new Error('requête bloquée vers ' + a.base.split('/api/')[0] + ' (' + e.message + ')'); });
    if (!res.ok) throw new Error('envoi refusé (' + res.status + ')');
    const nouveaux = await res.json();
    await upd(r.id, { PJ: ['L', ...ids(r.PJ), ...nouveaux] });
  } catch (e) { erreur(e); }
}
async function ouvrir(i) {
  try { const a = await api(); window.open(`${a.base}/attachments/${i}/download?auth=${a.token}`, '_blank'); }
  catch (e) { erreur(e); }
}

// ---- Réactions et commentaires ----
const REACTIONS = ['\uD83D\uDC4D', '\u2753'];
const ouvertes = new Set(), brouillons = {};   // commentaires dépliés, saisies en cours
let focusId = null;
const lireReac = r => { try { const o = JSON.parse(r.Reactions || '{}'); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } };
const lireComm = r => (r.Commentaires || '').split('\n').filter(Boolean)
  .map(l => { const i = l.indexOf('\t'); return i < 0 ? ['', l] : [l.slice(0, i), l.slice(i + 1)]; });
const ecrireComm = arr => arr.map(([a, t]) => a + '\t' + t).join('\n');

function reagir(r) {
  const z = el('div', 'reac');
  if (map.Reactions) {
    const o = lireReac(r);
    REACTIONS.forEach(e => {
      const qui = Array.isArray(o[e]) ? o[e] : [], aMoi = qui.includes(me);
      const b = el('button', 'rb' + (aMoi ? ' mine' : ''), e + (qui.length ? ' ' + qui.length : ''));
      b.title = qui.length && !anon ? qui.join(', ') : '';
      b.onclick = () => {
        if (!me) { $('#pseudo').focus(); return say('Indique ton prénom avant de réagir.'); }
        upd(r.id, { Reactions: JSON.stringify({ ...o, [e]: aMoi ? qui.filter(x => x !== me) : [...qui, me] }) });
      };
      z.append(b);
    });
  }
  if (map.Commentaires) {
    const cm = lireComm(r), bc = el('button', 'rb', '\uD83D\uDCAC' + (cm.length ? ' ' + cm.length : ''));
    bc.title = 'Commentaires';
    bc.onclick = () => { if (ouvertes.has(r.id)) ouvertes.delete(r.id); else ouvertes.add(r.id); render(); };
    z.append(bc);
    if (ouvertes.has(r.id)) {
      const lst = el('div', 'comms');
      cm.forEach(([au, tx], k) => {
        const li = el('div', 'comm'), nom = anon ? (au === me ? 'Moi' : '') : au;
        li.append(el('b', null, nom ? nom + ' :' : ''), el('span', null, tx));
        if (me && au === me) {
          const x = el('button', 'sup', '\u00D7'); x.title = 'Supprimer mon commentaire';
          x.onclick = () => upd(r.id, { Commentaires: ecrireComm(cm.filter((_, j) => j !== k)) });
          li.append(x);
        }
        lst.append(li);
      });
      const inp = el('input'); inp.placeholder = 'Ajouter un commentaire (Entrée)'; inp.value = brouillons[r.id] || '';
      inp.oninput = () => { brouillons[r.id] = inp.value; };
      inp.onfocus = () => { focusId = r.id; };
      inp.onblur = () => { if (focusId === r.id) focusId = null; };
      inp.onkeydown = ev => {
        if (ev.key !== 'Enter') return;
        const t = inp.value.trim().replace(/[\t\r\n]+/g, ' ');
        if (!t) return;
        if (!me) { $('#pseudo').focus(); return say('Indique ton prénom avant de commenter.'); }
        delete brouillons[r.id];
        upd(r.id, { Commentaires: ecrireComm([...cm, [me, t]]) });
      };
      lst.append(inp); z.append(lst);
      if (focusId === r.id) setTimeout(() => inp.focus(), 0);
    }
  }
  return z;
}

// ---- Podium (phase Résultats) ----
function podium() {
  const p = $('#podium'); p.textContent = '';
  p.hidden = phase !== 'resultats';
  if (phase !== 'resultats') return;
  p.append(el('h2', null, 'Résultats du vote'));
  const tri = recs.filter(r => voters(r).length).sort((a, b) => voters(b).length - voters(a).length || a.id - b.id);
  if (!tri.length) { p.append(el('p', null, 'Aucun vote enregistré.')); return; }
  const lignes = []; let prec = -1, rang = 0;
  tri.forEach((r, k) => {
    const v = voters(r).length;
    if (v !== prec) { rang = k + 1; prec = v; }   // ex æquo : même rang
    if (rang <= 3) lignes.push([rang, r, v]);
  });
  const noms = allCols();
  lignes.forEach(([rg, r, v]) => {
    const d = el('div', 'pod r' + rg), tx = el('div', 'tx');
    const info = [r.Colonne || noms[0] || '', anon ? '' : (r.Auteur || '')].filter(Boolean).join(' \u00B7 ');
    tx.append(el('span', null, r.Texte || ''), el('small', null, info));
    d.append(el('span', 'med', ['', '\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'][rg]), tx, el('span', 'n', v + ' vote' + (v > 1 ? 's' : '')));
    p.append(d);
  });
}

// ---- Mode projection (affichage local, propre à chaque poste) ----
const proj = on => {
  document.body.classList.toggle('proj', on);
  $('#projBtn').textContent = on ? 'Quitter la projection' : 'Projection';
};
$('#projBtn').onclick = () => proj(!document.body.classList.contains('proj'));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('proj')) proj(false); });

// ---- État de la séance : table « Session » si elle existe, sinon options du widget ----
// Phase, anonymat, minuteur et catégories sont réservés à l'animateur : si la table Session est
// protégée par les règles d'accès Grist, seuls les propriétaires peuvent la modifier.
let session = false, rowId = null, lastSess = '', file = Promise.resolve();
async function chargerSession() {
  let t;
  try { t = await grist.docApi.fetchTable('Session'); } catch (e) { return false; }   // pas de table : mode options
  session = true;
  const vide = !(t.id && t.id.length);
  rowId = vide ? null : t.id[0];
  const g = c => (vide || !t[c]) ? '' : (t[c][0] == null ? '' : t[c][0]);
  let c = []; try { c = JSON.parse(g('Categories') || '[]'); } catch (e) { c = []; }
  const sig = JSON.stringify([c, g('Phase'), g('Anonyme'), g('Fin')]);
  if (sig === lastSess) return true;
  lastSess = sig;
  cols = Array.isArray(c) ? c : [];
  phase = PHASES[g('Phase')] ? g('Phase') : 'ecriture';
  anon = g('Anonyme') === 'oui';
  fin = Number(g('Fin')) || 0;
  render();
  return true;
}
async function ecrire(k, v) {
  const champ = { phase: 'Phase', anon: 'Anonyme', fin: 'Fin', cols: 'Categories' }[k];
  const val = k === 'cols' ? JSON.stringify(v) : k === 'anon' ? (v ? 'oui' : '') : String(v);
  await grist.docApi.applyUserActions([rowId
    ? ['UpdateRecord', 'Session', rowId, { [champ]: val }]
    : ['AddRecord', 'Session', null, { [champ]: val }]]);
  await chargerSession();
}
// Les écritures sont mises en file pour éviter de créer deux lignes Session
const opt = (k, v) => {
  if (!session) return grist.setOption(k, v);
  file = file.then(() => ecrire(k, v)).catch(e => {
    const m = String((e && e.message) || e);
    say(/access|rule|denied|permission|blocked/i.test(m) ? 'Cette commande est réservée aux animateurs.' : 'Écriture impossible : ' + m);
    lastSess = '';
    return chargerSession();   // réaligner l'affichage sur l'état réel
  });
  return file;
};
chargerSession();
setInterval(() => { if (session) chargerSession(); }, 2500);

const COULEURS = { jaune: '#fff6c9', rose: '#ffd9e4', bleu: '#d6ebff', vert: '#d9f2d3', orange: '#ffe2c2' };

// Dépose la carte src sur la carte cible : elles forment un paquet (champ Groupe commun)
function grouper(srcId, cibleId) {
  if (!srcId || srcId === cibleId) return;
  if (phase !== 'decouverte') return say('Le regroupement se fait en phase Découverte.');
  const s = recs.find(r => r.id === srcId), t = recs.find(r => r.id === cibleId);
  if (!s || !t) return;
  const g = t.Groupe || ('g' + t.id), cat = t.Colonne || allCols()[0] || '';
  act(tb => {
    const a = [['UpdateRecord', tb, s.id, raw({ Groupe: g, Colonne: cat })]];
    if (!t.Groupe) a.push(['UpdateRecord', tb, t.id, raw({ Groupe: g })]);
    return a;
  }).catch(erreur);
}

// Regroupe les cartes d'une catégorie : un paquet = plusieurs cartes de même Groupe
function unites(list, parVotes) {
  const m = new Map(), u = [];
  list.forEach(r => {
    const g = map.Groupe && r.Groupe;
    if (g) {
      if (!m.has(g)) { const x = { cards: [] }; m.set(g, x); u.push(x); }
      m.get(g).cards.push(r);
    } else u.push({ cards: [r] });
  });
  const score = x => x.cards.reduce((s, r) => s + voters(r).length, 0);
  const rang = x => Math.min(...x.cards.map(r => r.id));
  return u.sort((a, b) => (parVotes || classe()) ? score(b) - score(a) || rang(a) - rang(b) : rang(a) - rang(b));
}

const MODELES = {
  retro: ['Bien', 'À améliorer', 'Idées'],
  dac: ['À démarrer', 'À arrêter', 'À continuer'],
  ffom: ['Forces', 'Faiblesses', 'Opportunités', 'Menaces'],
  '4l': ['Aimé', 'Appris', 'Manqué', 'Souhaité']
};
$('#modele').onchange = e => {
  const m = MODELES[e.target.value]; e.target.value = '';
  if (!m) return;
  const exist = allCols(), nouv = m.filter(c => !exist.includes(c));
  if (!nouv.length) return say('Ces catégories existent déjà.');
  cols = [...exist, ...nouv]; opt('cols', cols); render();
};
$('#rz-no').onclick = () => { $('#pan2').hidden = true; };
$('#rz-exp').onclick = () => { $('#pan2').hidden = true; montre(fmtSortie); };
$('#rz-go').onclick = async () => {
  const nom = $('#rz-nom').value.trim(), lignes = recs.map(r => r.id), noms = allCols();
  const garder = $('#rz-cat').checked ? noms : [];
  try {
    let ajout = [];
    if (lignes.length) {
      if (!nom) return say('Indique un nom de séance ou de groupe pour l\u2019archive.');
      let tab;
      try { tab = await grist.docApi.fetchTable('Archive'); }
      catch (e) { return say('Table « Archive » introuvable : crée-la d\u2019abord.'); }
      const manque = ['Seance', 'Date', 'Categorie', 'Texte', 'Auteur', 'Votes', 'Liens'].filter(c => !(c in tab));
      if (manque.length) return say('Colonnes manquantes dans Archive : ' + manque.join(', '));
      const n = new Date(), jour = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000;
      const col = { Seance: [], Date: [], Categorie: [], Texte: [], Auteur: [], Votes: [], Liens: [] };
      const pj = 'PJ' in tab && !!map.PJ; if (pj) col.PJ = [];
      const rea = 'Reactions' in tab, com = 'Commentaires' in tab;   // colonnes facultatives de l'archive
      if (rea) col.Reactions = [];
      if (com) col.Commentaires = [];
      const paq = 'Paquet' in tab, pq = paquets();
      if (paq) col.Paquet = [];
      recs.forEach(r => {
        col.Seance.push(nom); col.Date.push(jour); col.Categorie.push(r.Colonne || noms[0] || '');
        col.Texte.push(r.Texte || ''); col.Auteur.push(anon ? '' : (r.Auteur || ''));
        col.Votes.push(voters(r).length); col.Liens.push(r.Liens || '');
        if (pj) col.PJ.push(['L', ...ids(r.PJ)]);
        if (rea) col.Reactions.push(reacTxt(r));
        if (com) col.Commentaires.push(lireComm(r).map(commTxt).join(' | '));
        if (paq) col.Paquet.push(pq.get(r.Groupe) || '');
      });
      ajout = [['BulkAddRecord', 'Archive', lignes.map(() => null), col]];
    }
    // archivage et suppression dans une seule opération : tout passe ou rien
    if (lignes.length) await act(t => [...ajout, ['BulkRemoveRecord', t, lignes]]);
    opt('cols', garder);
    opt('phase', 'ecriture');
    opt('fin', 0);
    $('#pan2').hidden = true; $('#rz-nom').value = '';
    say(lignes.length ? `Séance « ${nom} » archivée (${lignes.length} idée${lignes.length > 1 ? 's' : ''}).` : 'Nouvelle séance prête.');
  } catch (e) { erreur(e); }
};

function allCols() {
  const extra = [...new Set(recs.map(r => r.Colonne).filter(Boolean))].filter(c => !cols.includes(c));
  return [...cols, ...extra];
}

function render() {
  const board = $('#board'); board.textContent = '';
  entete(); tick(); podium();
  $('#votes').textContent = me && phase === 'vote' ? `Votes restants : ${MAX_VOTES - mesVotes()} / ${MAX_VOTES}` : '';
  const names = allCols();
  if (!names.length) { board.append(el('div', 'vide', 'Aucune catégorie. Crée la première avec « Ajouter une catégorie ».')); return; }
  names.forEach((name, i) => {
    const mine = recs.filter(r => visible(r) && (r.Colonne || names[0]) === name)
      .sort((a, b) => classe() ? voters(b).length - voters(a).length : a.id - b.id);
    const col = el('section', 'col');
    const h = el('h2'); h.append(el('b', null, name), el('span', null, mine.length));
    if (anim) h.append(outils(name, i, names, recs.filter(r => (r.Colonne || names[0]) === name).length));
    const list = el('div', 'cards');
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const id = Number(e.dataTransfer.getData('text/plain'));
      if (id) {
        const r0 = recs.find(r => r.id === id);
        upd(id, r0 && r0.Groupe ? { Colonne: name, Groupe: '' } : { Colonne: name });
      }
    });
    unites(mine).forEach(x => {
      if (x.cards.length < 2) return list.append(card(x.cards[0]));
      const p = el('div', 'paquet'); p.dataset.n = x.cards.length;
      x.cards.forEach(r => p.append(card(r)));
      list.append(p);
    });

    const ajout = el('div', 'ajout');
    const ta = el('textarea'); ta.placeholder = 'Nouvelle idée'; ta.setAttribute('aria-label', 'Nouvelle idée dans ' + name);
    const b = el('button', null, 'Ajouter');
    b.onclick = () => {
      if (!me) { $('#pseudo').focus(); return say('Indique ton prénom avant d\u2019ajouter une idée.'); }
      const t = ta.value.trim(); if (!t) return;
      add({ Texte: t, Colonne: name, Auteur: me, Votants: '' });
      ta.value = '';
    };
    ajout.append(ta, b);
    col.append(h, list, ajout);
    board.append(col);
  });
}

function card(r) {
  const c = el('article', 'card'); c.draggable = true;
  c.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', String(r.id)));
  c.style.background = COULEURS[r.Couleur] || COULEURS.jaune;
  if (map.Groupe) {   // colonne « Groupe » associée : on peut déposer une carte sur une autre
    c.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); c.classList.add('cible'); });
    c.addEventListener('dragleave', () => c.classList.remove('cible'));
    c.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); c.classList.remove('cible');
      grouper(Number(e.dataTransfer.getData('text/plain')), r.id);
    });
  }
  const p = el('p', null, r.Texte || ''); c.append(p);
  if (map.PJ) {   // colonne « Pièces jointes » associée
    const mien = !!r.Auteur && r.Auteur === me, pj = ids(r.PJ), z = el('div', 'pj');
    pj.forEach(i => {
      charger(i);
      const s = el('span', 'fic'), a = el('a', null, '\uD83D\uDCCE ' + (noms[i] || ''));
      a.href = '#'; a.onclick = e => { e.preventDefault(); ouvrir(i); };
      s.append(a);
      if (mien) {
        const x = el('button', 'sup', '\u00D7'); x.title = 'Retirer cette pièce jointe';
        x.onclick = () => upd(r.id, { PJ: ['L', ...pj.filter(k => k !== i)] });
        s.append(x);
      }
      z.append(s);
    });
    if (z.children.length) c.append(z);
  }
  if (map.Liens) {   // colonne « Liens » associée : liens vers des documents en ligne
    const mien = !!r.Auteur && r.Auteur === me, z = el('div', 'pj');
    const l = (r.Liens || '').split('\n').filter(Boolean);
    const maj = arr => upd(r.id, { Liens: arr.join('\n') });
    l.forEach((ligne, k) => {
      const [nom, url] = ligne.includes('\t') ? ligne.split('\t') : ['', ligne];
      if (!/^https?:\/\//i.test(url)) return;
      const s = el('span', 'fic'), a = el('a', null, '\uD83D\uDD17 ' + (nom || url.replace(/^https?:\/\//i, '')));
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = url;
      s.append(a);
      if (mien) {
        const x = el('button', 'sup', '\u00D7'); x.title = 'Retirer ce lien';
        x.onclick = () => maj(l.filter((_, j) => j !== k));
        s.append(x);
      }
      z.append(s);
    });
    if (mien) {
      const b = el('button', 'sup', '\uD83D\uDD17+'); b.title = 'Ajouter un lien vers un document';
      b.onclick = () => {
        const f = el('div', 'ajoutlien'), u = el('input'), n = el('input'), ok = el('button', null, 'OK');
        u.placeholder = 'https://… (adresse du document)'; n.placeholder = 'Nom affiché (facultatif)';
        ok.onclick = () => {
          const url = u.value.trim();
          if (!/^https?:\/\//i.test(url)) return say('L\u2019adresse doit commencer par http:// ou https://');
          maj([...l, n.value.trim().replace(/[\t\r\n]+/g, ' ') + '\t' + url]);
        };
        f.append(u, n, ok); z.after(f); b.remove();
      };
      z.append(b);
    }
    if (z.children.length) c.append(z);
  }
  if (phase !== 'ecriture' && (map.Reactions || map.Commentaires)) c.append(reagir(r));
  const m = el('div', 'meta'); m.append(el('span', 'de', anon ? (r.Auteur === me ? 'Moi' : '') : (r.Auteur || '')));
  const v = voters(r), aVote = v.includes(me);
  const bv = el('button', 'vote' + (aVote ? ' mine' : ''), '\u25B2 ' + v.length);
  bv.title = aVote ? 'Retirer mon vote' : 'Voter pour cette idée';
  bv.onclick = () => {
    if (!me) { $('#pseudo').focus(); return say('Indique ton prénom avant de voter.'); }
    if (!aVote && mesVotes() >= MAX_VOTES) return say(`Tu as utilisé tes ${MAX_VOTES} votes. Retire-en un pour voter ici.`);
    const n = aVote ? v.filter(x => x !== me) : [...v, me];
    upd(r.id, { Votants: n.join(',') });
  };
  if (phase === 'vote') m.append(bv);
  else if (phase === 'resultats') m.append(el('span', null, '\u25B2 ' + v.length));
  if (r.Auteur && r.Auteur === me) {
    if (phase === 'ecriture' || phase === 'decouverte') {   // pas de modification pendant le vote
      const ed = el('button', 'sup', '\u270E'); ed.title = 'Modifier mon idée';
      ed.onclick = () => {
        const f = el('div', 'ajoutlien'), ta = el('textarea'), ok = el('button', null, 'Enregistrer'), an = el('button', 'sup', 'Annuler');
        ta.value = r.Texte || '';
        ok.onclick = () => { const t = ta.value.trim(); if (t && t !== r.Texte) upd(r.id, { Texte: t }); else render(); };
        an.onclick = () => render();
        f.append(ta, ok, an); p.replaceWith(f); ta.focus();
      };
      m.append(ed);
    }
    if (map.Couleur) {   // colonne « Couleur » associée
      const pal = el('button', 'sup', '\uD83C\uDFA8'); pal.title = 'Couleur du post-it';
      pal.onclick = () => {
        const z = el('span', 'palette');
        Object.entries(COULEURS).forEach(([k, v]) => {
          const b = el('button', 'pt'); b.style.background = v; b.title = k; b.setAttribute('aria-label', k);
          b.onclick = () => upd(r.id, { Couleur: k });
          z.append(b);
        });
        pal.replaceWith(z);
      };
      m.append(pal);
    }
    const s = el('button', 'sup', '\u00D7'); s.title = 'Supprimer mon idée';
    s.onclick = () => del(r.id);
    m.append(s);
  }
  c.append(m);
  return c;
}
